<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CropGuard AI — Inference Test</title>
  <meta name="description" content="Browser inference test harness for CropGuard AI. Runs the TFLite production model locally via LiteRT.js." />
  <link rel="manifest" href="manifest.json" />
  <style>
    body {
      font-family: monospace;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #0f1b0e;
      color: #c8e6c9;
    }
    h1 { color: #66bb6a; margin-bottom: 0.25rem; }
    p.subtitle { color: #888; margin-top: 0; font-size: 0.85rem; }
    #status {
      background: #1a2b1a;
      border: 1px solid #2d5a2d;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      margin: 1rem 0;
      min-height: 1.5rem;
    }
    #status.error { border-color: #c62828; color: #ef9a9a; }
    #status.ok { border-color: #2e7d32; color: #a5d6a7; }
    label[for="file-input"] {
      display: inline-block;
      background: #2d7a3a;
      color: #fff;
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    label[for="file-input"]:hover { background: #388e3c; }
    #file-input { display: none; }
    #preview {
      display: none;
      width: 224px;
      height: 224px;
      object-fit: cover;
      border: 1px solid #2d5a2d;
      margin: 0.75rem 0;
      image-rendering: pixelated; /* shows exact model input pixels */
    }
    #result-box {
      display: none;
      background: #111f11;
      border: 1px solid #2d5a2d;
      border-radius: 4px;
      padding: 1rem;
      margin-top: 1rem;
    }
    #result-box h2 { margin: 0 0 0.5rem; color: #81c784; font-size: 1rem; }
    #prediction { font-size: 1.3rem; font-weight: bold; color: #a5d6a7; }
    #confidence { color: #888; font-size: 0.85rem; margin: 0.25rem 0 0.75rem; }
    #raw-output {
      white-space: pre-wrap;
      font-size: 0.78rem;
      color: #9e9e9e;
      max-height: 300px;
      overflow-y: auto;
      border-top: 1px solid #1e3a1e;
      padding-top: 0.5rem;
      margin-top: 0.5rem;
    }
    #timing { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #2d5a2d;
      border-top-color: #66bb6a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>🌿 CropGuard AI</h1>
  <p class="subtitle">
    Browser inference test — LiteRT.js · dynamic-range TFLite ·
    MobileNetV3Small · 17 classes
  </p>

  <div id="status">Initializing LiteRT runtime…</div>

  <label for="file-input">📂 Choose image</label>
  <input type="file" id="file-input" accept="image/*" disabled />

  <br />
  <img id="preview" alt="Selected image preview (224×224)" />

  <div id="result-box">
    <h2>Prediction</h2>
    <div id="prediction">—</div>
    <div id="confidence">—</div>
    <div id="timing">—</div>
    <div id="raw-output"></div>
  </div>

  <!-- app.js is a standard ES module — no bundler needed for the test harness -->
  <script type="module" src="app.js"></script>
</body>
</html>
